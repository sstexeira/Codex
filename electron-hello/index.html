<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello App</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f6f6;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 24px 28px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        display: grid;
        gap: 16px;
        min-width: 280px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }

      .buttons {
        display: grid;
        gap: 12px;
      }

      button {
        border: none;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
      }

      #go {
        background: #1f7aec;
        color: white;
      }

      #scared {
        background: #e9e9e9;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="message">Choose:</h1>
      <div class="buttons">
        <button id="go">Let's go!</button>
        <button id="scared">I'm scared.</button>
      </div>
    </div>

    <script>
      const message = document.getElementById("message");
      const go = document.getElementById("go");
      const scared = document.getElementById("scared");

      go.addEventListener("click", () => {
        message.textContent = "Hello world!";
      });

      scared.addEventListener("click", () => {
        if (window.appBridge && window.appBridge.quit) {
          window.appBridge.quit();
        }
      });
    </script>
  </body>
</html>
